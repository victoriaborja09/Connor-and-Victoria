<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#edc8bd">
  <meta name="description" content="Take a stroll through Connor and Victoria's little coastal town.">
  <title>Connor & Victoria · Our Little Town</title>
  <link rel="preload" href="./assets/storefront-scene.webp" as="image" type="image/webp">
  <link rel="stylesheet" href="./street.css">
  <script src="./characters3d.js" defer></script>
  <script src="./street.js" defer></script>
</head>
<body>
  <main class="street overview" id="street" aria-label="Explore Connor and Victoria's three seaside shops">
    <div class="camera" id="camera" aria-label="Three pastel storefronts on a seaside street at golden hour: Connor's Coffee Shop, Connor and Victoria's Bookstore, and Victoria's Hobby Store">
      <div class="scene-world" id="scene-world">
        <!-- The original approved storefront art is used completely unchanged. -->
        <img id="street-image" class="street-image" src="./assets/storefront-scene.webp" width="1672" height="941" alt="A beautifully detailed coastal street at golden hour, with a pink coffee shop, a blue bookstore and a white hobby store under striped awnings; mountains and the sea behind them." draggable="false">
        <!-- WebGL characters: actual meshes constructed in characters3d.js; not images. -->
        <div class="characters3d-layer" id="characters3d-layer" aria-label="Connor and Victoria are animated 3D characters; click to wave">
          <canvas id="characters3d" aria-label="Connor and Victoria 3D avatars" title="Click to wave hello"></canvas>
        </div>
        <div class="overview-hotspots" id="hotspots" aria-label="Choose a storefront">
          <button class="hotspot" type="button" data-target="0" aria-label="Zoom in on Connor's Coffee Shop" title="Connor's Coffee Shop"></button>
          <button class="hotspot" type="button" data-target="1" aria-label="Zoom in on Connor and Victoria's Bookstore" title="Connor and Victoria's Bookstore"></button>
          <button class="hotspot" type="button" data-target="2" aria-label="Zoom in on Victoria's Hobby Store" title="Victoria's Hobby Store"></button>
        </div>
      </div>
    </div>
    <button class="zoom-toggle" id="zoom-toggle" type="button" aria-label="Zoom out to see all three shops" title="See the full street" hidden>
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8.25 3.5H4.5v3.75M15.75 3.5h3.75v3.75M8.25 20.5H4.5v-3.75m11.25 3.75h3.75v-3.75M4.5 3.5l5 5m10-5-5 5m-10 12 5-5m10 5-5-5" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Zoom out</span>
    </button>
  </main>
</body>
</html>
